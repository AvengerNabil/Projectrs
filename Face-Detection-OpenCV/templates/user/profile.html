{% extends "base.html" %}

{% block content %}
<div class="glass-card" style="max-width: 600px;">
    <h2>My Profile</h2>
    
    <div style="margin-top: 20px;">
        <p><strong>Name:</strong> {{ user.name }}</p>
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Role:</strong> <span style="text-transform: capitalize;">{{ user.role }}</span></p>
        <p><strong>Department:</strong> {{ user.department_name or 'N/A' }}</p>
    </div>
    
    <div style="margin-top: 30px;">
        <a href="{{ url_for('users.face_register') }}" class="btn btn-primary">Update Face Registration</a>
    </div>
</div>
{% endblock %}
