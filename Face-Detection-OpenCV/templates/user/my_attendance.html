{% extends "base.html" %}

{% block content %}
<h2>My Attendance History</h2>

<div class="glass-card" style="margin-top: 20px;">
    <table class="data-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Check-in Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for record in records %}
            <tr>
                <td>{{ record.date }}</td>
                <td>{{ record.check_in_time }}</td>
                <td><span class="badge badge-{{ record.status }}">{{ record.status | upper }}</span></td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3" style="text-align: center;">No attendance records found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
